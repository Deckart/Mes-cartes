name: Compiler APK Mes Cartes

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restaurer le keystore de signature debug
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Configurer Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Compiler l'APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: mes-cartes-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
